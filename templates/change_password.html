<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | Smart Student Portal</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .password-help {
            color: #666;
            font-size: 14px;
            margin: 8px 0 18px;
        }

        .password-error {
            color: #b42318;
            margin: 12px 0;
        }

        .password-field {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccd2dc;
            border-radius: 8px;
        }

        .password-label {
            display: block;
            margin: 14px 0 6px;
            font-weight: 600;
        }

        .password-submit {
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>

<body class="login-body">

    <main class="login-container">

        <section class="login-card">

            <h1>Change Your Password</h1>

            <p class="password-help">
                You are using a temporary password.
                Please create a new password to continue.
            </p>

            {% if error %}
                <p class="password-error" role="alert">
                    {{ error }}
                </p>
            {% endif %}

            <form method="POST"
                  action="{{ url_for('change_password') }}">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token }}"
                >

                <label class="password-label" for="new_password">
                    New Password
                </label>

                <input
                    class="password-field"
                    type="password"
                    id="new_password"
                    name="new_password"
                    minlength="12"
                    autocomplete="new-password"
                    required
                >

                <p class="password-help">
                    Use at least 12 characters.
                </p>

                <label class="password-label" for="confirm_password">
                    Confirm New Password
                </label>

                <input
                    class="password-field"
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    minlength="12"
                    autocomplete="new-password"
                    required
                >

                <button
                    class="login-button password-submit"
                    type="submit"
                >
                    Save New Password
                </button>

            </form>

            <p class="password-help">
                <a href="{{ url_for('logout') }}">Log out</a>
            </p>

        </section>

    </main>

</body>
</html>
